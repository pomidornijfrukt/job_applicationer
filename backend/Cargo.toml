[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
envy = "0.4.2"
reqwest = "0.13.4"
scraper = "0.27.0"
serde = "1.0.229"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
url = { version = "2.5.8", features = ["serde"] }
