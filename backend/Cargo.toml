[profile.dev]
opt-level = 1
overflow-checks = false
incremental = true

[workspace]
members = [
    ".",
    "./crates/app-error",
    "./crates/llm-extractor",
]

[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
app-error = { path = "./crates/app-error" }
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
llm = { path = "./crates/llm-extractor" }
envy = "0.4.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking"] }
rquickjs = "0.12.2"
scraper = "0.27.0"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
log = "0.4.34"
